    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {

      display: flex; justify-content: center; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden; position: relative;
    }
    /* 浮动气泡动画 */
    .bubble {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: float linear infinite;
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      100% { transform: translateY(-20vh) scale(1); opacity: 0; }
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 32px;
      max-width: 460px; width: 90%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      position: relative; z-index: 1;
    }
    .card h1 { font-size: 22px; color: #333; margin-bottom: 8px; }
    .card .tip { font-size: 13px; color: #999; margin-bottom: 24px; }
    .link-list { list-style: none; }
    .link-list li { margin-bottom: 14px; }
    .link-list a {
      display: block; padding: 14px; border-radius: 10px;
      background: #f0faf7; color: #02a982; text-decoration: none;
      font-size: 15px; font-weight: 500;
      transition: background .2s, transform .15s;
    }
    .link-list a:hover { background: #02a982; color: #fff; transform: scale(1.02); }
    .section-title {
      font-size: 15px; color: #666; margin: 24px 0 16px;
      padding-top: 20px; border-top: 1px solid #eee;
    }
    .download-grid {
      display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
    }
    .download-card {
      flex: 1; min-width: 110px; max-width: 140px;
      padding: 18px 10px 14px; border-radius: 12px;
      background: linear-gradient(135deg, #f8f9fa, #fff);
      border: 1.5px solid #e8e8e8;
      text-decoration: none; color: #333;
      transition: all .25s ease; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .download-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border-color: #02a982;
    }
    .download-card svg { width: 36px; height: 36px; }
    .download-card .dl-name {
      font-size: 13px; font-weight: 600; color: #333;
    }
    .download-card .dl-ext {
      font-size: 11px; color: #999; margin-top: -4px;
    }
    .footer { margin-top: 28px; font-size: 12px; color: #bbb; }
  </style>
